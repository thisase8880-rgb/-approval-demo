<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전자결재</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#1f2937;--mute:#6b7280;--line:#d9dce1;--brand:#1e3a5f;--brand-t:#fff;--seal:#c8231c;--ok:#1d7a4d;--wait:#b7791f;--no:#c8231c;--soft:#eef1f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1b212a;--ink:#e6e9ee;--mute:#9aa3b0;--line:#2e3744;--brand:#6f9bd1;--brand-t:#0f1722;--seal:#ec5b53;--ok:#4cc38a;--wait:#e0a83f;--no:#ec5b53;--soft:#232b36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1b212a;--ink:#e6e9ee;--mute:#9aa3b0;--line:#2e3744;--brand:#6f9bd1;--brand-t:#0f1722;--seal:#ec5b53;--ok:#4cc38a;--wait:#e0a83f;--no:#ec5b53;--soft:#232b36;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{background:var(--brand);color:var(--brand-t);border:0;border-radius:6px;padding:8px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.no{background:var(--no);color:#fff}.btn.ok{background:var(--ok);color:#fff}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:400px}
.brand{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:28px;color:var(--brand);margin:0 0 4px}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.demo button{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px}
.err{color:var(--no);font-size:13px;min-height:20px;margin-top:8px}
/* app */
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-size:20px;margin:0}
header .me{font-size:14px;display:flex;gap:12px;align-items:center}
main{max-width:980px;margin:0 auto;padding:20px;display:grid;grid-template-columns:190px 1fr;gap:20px}
@media(max-width:700px){main{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;gap:6px}}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px;white-space:nowrap;gap:10px}
nav button.on{background:var(--panel);border:1px solid var(--line);font-weight:700}
nav .cnt{background:var(--seal);color:#fff;border-radius:10px;font-size:12px;padding:0 7px}
nav .new{margin-bottom:10px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:90px 1fr 120px 80px;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}.row:hover{background:var(--soft)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute)}
@media(max-width:700px){.row{grid-template-columns:1fr auto}.row .c3{display:none}}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;border:1px solid currentColor;text-align:center;justify-self:end}
.s-대기{color:var(--wait)}.s-승인{color:var(--ok)}.s-반려{color:var(--no)}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:start center;padding:24px 12px;overflow:auto;z-index:20}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;padding:26px}
.doc h2{margin:0 0 14px;font-size:20px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
.meta{font-size:13px;color:var(--mute)}
.line{display:flex;gap:0;border:1px solid var(--line)}
.line>div{width:96px;text-align:center;border-left:1px solid var(--line)}
.line>div:first-child{border-left:0}
.line .r{background:var(--soft);font-size:12px;padding:2px;border-bottom:1px solid var(--line)}
.line .b{height:84px;display:grid;place-items:center;font-size:13px}
.seal{width:60px;height:60px;border:3px solid var(--seal);border-radius:50%;color:var(--seal);display:grid;place-items:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:15px;line-height:1.1;transform:rotate(-12deg);box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px var(--seal);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
.seal.no{border-style:dashed}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.seal{animation:none}}
.body{white-space:pre-wrap;background:var(--soft);border-radius:6px;padding:14px;min-height:110px}
.cmt{margin-top:12px;padding:10px 14px;border-left:3px solid var(--seal);background:var(--soft);font-size:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;margin-top:6px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.file small,figcaption small{color:var(--mute)}
.file .btn{padding:2px 10px;font-size:13px}
.files figure{margin:8px 0 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.files img{display:block;max-width:100%;max-height:320px;margin:auto}
.files figcaption{padding:6px 10px;font-size:14px;background:var(--soft)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:30}
</style>
</head>
<body>

<section id="login">
 <form class="card" id="lf" onsubmit="return false">
  <h1 class="brand">전자결재</h1>
  <div class="meta">계정으로 로그인하세요</div>
  <label for="uid">아이디</label><input id="uid" autocomplete="username">
  <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn" style="width:100%" id="go">로그인</button>
  <label>테스트 계정 (비밀번호 1234)</label>
  <div class="demo" id="demo"></div>
 </form>
</section>

<section id="app" class="hide">
 <header><h1 class="brand">전자결재</h1>
  <div class="me"><span id="who"></span><button class="btn ghost" id="out">로그아웃</button></div></header>
 <main><nav id="nav"></nav><div id="view"></div></main>
</section>
<div id="modal"></div>

<script>
const USERS=[
 {id:'kim',pw:'1234',name:'김민수',role:'사원'},
 {id:'lee',pw:'1234',name:'이영희',role:'팀장'},
 {id:'park',pw:'1234',name:'박정호',role:'이사'}];
const TYPES=['업무기안','휴가신청','지출결의'];
const KEY='eapproval-v1';
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
 return mem||seed()}
function save(d){mem=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){toast('저장 공간이 부족해 새로고침하면 데이터가 사라질 수 있습니다.')}}
function seed(){const d={n:3,docs:[
 {id:1,type:'휴가신청',title:'12월 연차 사용 신청',body:'12월 24일(목) 연차를 사용하고자 합니다.\n업무 인수인계는 사전에 완료하겠습니다.',author:'kim',approver:'lee',status:'대기',at:'2026-11-17 09:12'},
 {id:2,type:'지출결의',title:'팀 워크숍 장소 대관비',body:'12월 팀 워크숍 장소 대관비 지출을 요청드립니다.\n금액: 1,200,000원',author:'lee',approver:'park',status:'대기',at:'2026-11-18 14:30'},
 {id:3,type:'업무기안',title:'4분기 업무 보고 양식 개선',body:'보고 양식을 간소화하여 작성 시간을 줄이고자 합니다.',author:'kim',approver:'lee',status:'승인',at:'2026-11-10 10:05',decided:'2026-11-11 08:50',comment:'좋은 제안입니다. 진행하세요.'}]};
 save(d);return d}
let D=load(),me=null,tab='todo';
const $=s=>document.querySelector(s);
const U=id=>USERS.find(u=>u.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
function toast(m){const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}

/* login */
$('#demo').innerHTML=USERS.map(u=>`<button type="button" data-id="${u.id}">${u.name}<br><small>${u.role}</small></button>`).join('');
$('#demo').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#uid').value=b.dataset.id;$('#pw').value='1234';doLogin()};
$('#go').onclick=doLogin;
$('#pw').onkeydown=e=>{if(e.key==='Enter')doLogin()};
function doLogin(){const u=USERS.find(x=>x.id===$('#uid').value.trim()&&x.pw===$('#pw').value);
 if(!u){$('#err').textContent='아이디 또는 비밀번호가 맞지 않습니다. 테스트 계정 버튼을 눌러 보세요.';return}
 me=u;D=load();tab=todo().length?'todo':'mine';$('#err').textContent='';
 $('#login').classList.add('hide');$('#app').classList.remove('hide');
 $('#who').textContent=`${u.name} ${u.role}`;render()}
$('#out').onclick=()=>{me=null;$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').value=''};

/* lists */
const todo=()=>D.docs.filter(d=>d.approver===me.id&&d.status==='대기');
const mine=()=>D.docs.filter(d=>d.author===me.id);
const done=()=>D.docs.filter(d=>d.approver===me.id&&d.status!=='대기');
function render(){
 const t=todo().length;
 $('#nav').innerHTML=`<button class="btn new" id="nw" style="text-align:center;justify-content:center">+ 새 기안 작성</button>
 <button data-t="todo" class="${tab==='todo'?'on':''}">결재 대기 ${t?`<span class="cnt">${t}</span>`:''}</button>
 <button data-t="mine" class="${tab==='mine'?'on':''}">내 기안함</button>
 <button data-t="done" class="${tab==='done'?'on':''}">결재 완료</button>`;
 $('#nw').onclick=compose;
 $('#nav').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 const L={todo,mine,done}[tab]().sort((a,b)=>b.id-a.id);
 const msg={todo:'결재할 문서가 없습니다.',mine:'작성한 기안이 없습니다. 새 기안을 작성해 보세요.',done:'결재를 마친 문서가 없습니다.'}[tab];
 $('#view').innerHTML=`<div class="list">${L.length?L.map(d=>`<button class="row" data-id="${d.id}">
  <small>${d.type}</small><span class="t">${d.files&&d.files.length?'📎 ':''}${esc(d.title)}</span>
  <small class="c3">${tab==='mine'?'결재자 '+U(d.approver).name:'기안자 '+U(d.author).name}</small>
  <span class="badge s-${d.status}">${d.status}</span></button>`).join(''):`<div class="empty">${msg}</div>`}</div>`;
 $('#view').querySelectorAll('.row').forEach(r=>r.onclick=()=>detail(+r.dataset.id))}

/* compose */
function compose(){
 const ap=USERS.filter(u=>u.id!==me.id);
 $('#modal').innerHTML=`<div class="ov"><div class="doc"><h2>새 기안 작성</h2>
 <label for="ty">문서 종류</label><select id="ty">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
 <label for="ti">제목</label><input id="ti" maxlength="60">
 <label for="bo">내용</label><textarea id="bo" rows="7"></textarea>
 <label for="fl">첨부파일 (파일당 1MB, 최대 5개)</label><input id="fl" type="file" multiple><div id="fls"></div>
 <label for="ap">결재자</label><select id="ap">${ap.map(u=>`<option value="${u.id}">${u.name} ${u.role}</option>`).join('')}</select>
 <div class="err" id="ce"></div>
 <div class="acts"><button class="btn ghost" id="cx">취소</button><button class="btn" id="sb">결재 요청</button></div></div></div>`;
 $('#cx').onclick=()=>$('#modal').innerHTML='';
 let pf=[];const fl=$('#fl'),fls=$('#fls');
 const draw=()=>{fls.innerHTML=pf.map((f,i)=>`<div class="file"><span>📎 ${esc(f.name)} <small>${fmt(f.size)}</small></span><button type="button" class="btn ghost" data-i="${i}">삭제</button></div>`).join('')};
 fls.onclick=e=>{const b=e.target.closest('button');if(b){pf.splice(+b.dataset.i,1);draw()}};
 fl.onchange=async()=>{$('#ce').textContent='';const tot=()=>pf.reduce((s,f)=>s+f.size,0);
  for(const f of fl.files){
   if(pf.length>=5){$('#ce').textContent='첨부는 최대 5개까지 가능합니다.';break}
   if(f.size>1048576){$('#ce').textContent=`${f.name}: 1MB를 넘어 첨부할 수 없습니다.`;continue}
   if(tot()+f.size>2621440){$('#ce').textContent='첨부 총 용량은 2.5MB까지입니다.';continue}
   const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f)});
   if(url)pf.push({name:f.name,size:f.size,type:f.type,url});
  }
  fl.value='';draw()};
 $('#sb').onclick=()=>{const ti=$('#ti').value.trim(),bo=$('#bo').value.trim();
  if(!ti||!bo){$('#ce').textContent='제목과 내용을 모두 입력해 주세요.';return}
  D.n++;D.docs.push({id:D.n,type:$('#ty').value,title:ti,body:bo,author:me.id,approver:$('#ap').value,status:'대기',at:now(),files:pf});
  save(D);$('#modal').innerHTML='';tab='mine';render();toast('결재를 요청했습니다.')}}

/* detail */
const fmt=n=>n<1024?n+'B':n<1048576?(n/1024).toFixed(0)+'KB':(n/1048576).toFixed(1)+'MB';
const fileHtml=fs=>fs&&fs.length?`<label>첨부파일 (${fs.length})</label><div class="files">${fs.map(f=>f.type.startsWith('image/')?`<figure><img src="${f.url}" alt="${esc(f.name)}"><figcaption>📎 ${esc(f.name)} <small>${fmt(f.size)}</small></figcaption></figure>`:`<div class="file"><span>📎 ${esc(f.name)} <small>${fmt(f.size)}</small></span></div>`).join('')}</div>`:'';
function detail(id){
 const d=D.docs.find(x=>x.id===id),a=U(d.author),p=U(d.approver);
 const canAct=d.approver===me.id&&d.status==='대기';
 const stamp=d.status==='대기'?`<span class="meta">대기</span>`:`<div class="seal ${d.status==='반려'?'no':''}">${esc(p.name.slice(0,1))}<br>${d.status}</div>`;
 $('#modal').innerHTML=`<div class="ov"><div class="doc">
 <div class="head"><div><div class="meta">${d.type} · 문서번호 ${String(d.id).padStart(4,'0')}</div><h2 style="margin:6px 0 4px">${esc(d.title)}</h2>
  <div class="meta">기안 ${a.name} ${a.role} · ${d.at}</div></div>
  <div class="line"><div><div class="r">기안</div><div class="b"><div class="seal" style="transform:rotate(-8deg);animation:none">${a.name.slice(0,1)}<br>기안</div></div></div>
  <div><div class="r">${p.role}</div><div class="b">${stamp}</div></div></div></div>
 <div class="body">${esc(d.body)}</div>
 ${fileHtml(d.files)}
 ${d.comment?`<div class="cmt"><b>${p.name}</b> · ${d.decided}<br>${esc(d.comment)}</div>`:''}
 ${canAct?`<label for="cm">결재 의견 (선택)</label><textarea id="cm" rows="2"></textarea>`:''}
 <div class="acts"><button class="btn ghost" id="cl">닫기</button>
 ${canAct?`<button class="btn no" id="rj">반려</button><button class="btn ok" id="ok">승인</button>`:''}</div></div></div>`;
 $('#cl').onclick=()=>$('#modal').innerHTML='';
 if(canAct){const act=s=>{d.status=s;d.comment=$('#cm').value.trim();d.decided=now();save(D);
   $('#modal').innerHTML='';render();toast(s==='승인'?'승인했습니다.':'반려했습니다.')};
  $('#ok').onclick=()=>act('승인');$('#rj').onclick=()=>act('반려')}}
</script>
</body>
</html>
